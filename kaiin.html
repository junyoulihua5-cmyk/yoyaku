<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>千早駅整骨院 会員証</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* layout: スマホ1列。いちばん上に黒い会員カード、その下に「次の予約→今の段階→今月の回数→残高→来院履歴」の順。料金表と同じオレンジ×ブラック */
:root {
  --bg: #f7f7f6; --surface: #ffffff; --surface2: #f2f2f0; --border: #e4e3e0;
  --fg: #1a1a1a; --fg2: #555550; --fg3: #7d7d77; --ink: #1a1a1a; --on-ink: #ffffff; --ink-sub: #a9a8a0;
  --accent: #c9560a; --accent-strong: #e8650a; --accent-light: #fef0e6;
  --green: #1e7a46; --green-bg: #e8f6ee; --red: #b3261e; --red-bg: #fdecea;
  --font: 'Noto Sans JP', -apple-system, 'Hiragino Sans', sans-serif;
  --radius: 12px; --radius-sm: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141412; --surface: #1f1f1c; --surface2: #2a2a26; --border: #38382f;
    --fg: #f0efe8; --fg2: #b8b8aa; --fg3: #8a8a7e; --ink: #0b0b0a; --on-ink: #f0efe8; --ink-sub: #8a8a7e;
    --accent: #f07530; --accent-strong: #f07530; --accent-light: #2a1c08;
    --green: #5fd18f; --green-bg: #0f2418; --red: #ff8a80; --red-bg: #2c1210; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141412; --surface: #1f1f1c; --surface2: #2a2a26; --border: #38382f;
  --fg: #f0efe8; --fg2: #b8b8aa; --fg3: #8a8a7e; --ink: #0b0b0a; --on-ink: #f0efe8; --ink-sub: #8a8a7e;
  --accent: #f07530; --accent-strong: #f07530; --accent-light: #2a1c08;
  --green: #5fd18f; --green-bg: #0f2418; --red: #ff8a80; --red-bg: #2c1210; color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font);
  font-size: 15px; line-height: 1.7;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 48px;
}
.wrap { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.demo { font-size: 12px; font-weight: 700; color: var(--accent); background: var(--accent-light); border: 1px solid var(--accent); border-radius: 999px; padding: 2px 12px; align-self: center; margin: 0; }

.mcard { background: var(--ink); color: var(--on-ink); border-radius: 16px; padding: 18px 20px 16px; position: relative; overflow: hidden; }
.mcard::after { content: ""; position: absolute; right: -40px; top: -40px; width: 160px; height: 160px; border-radius: 50%; border: 18px solid var(--accent-strong); opacity: .9; }
.mcard .clinic { font-size: 11px; letter-spacing: .18em; color: var(--ink-sub); margin: 0; }
.mcard .label { font-size: 12px; font-weight: 700; color: var(--accent-strong); letter-spacing: .1em; margin: 2px 0 14px; }
.mcard .nm { font-size: 22px; font-weight: 700; margin: 0; letter-spacing: .04em; position: relative; z-index: 1; }
.mcard .row { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; margin-top: 8px; position: relative; z-index: 1; }
.mcard .no { font-size: 13px; color: var(--ink-sub); margin: 0; font-variant-numeric: tabular-nums; letter-spacing: .08em; }
.mcard .no b { color: var(--on-ink); font-size: 16px; }
.mcard .linked { font-size: 11px; color: var(--ink-sub); margin: 0; }

section.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.h { font-size: 12px; font-weight: 700; color: var(--fg3); letter-spacing: .08em; margin: 0; }
.big { font-size: 26px; font-weight: 700; margin: 0; line-height: 1.3; font-variant-numeric: tabular-nums; }
.big small { font-size: 14px; font-weight: 500; color: var(--fg2); margin-left: 4px; }
.sub { font-size: 13px; color: var(--fg2); margin: 0; }
.list { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; }
.list li { white-space: nowrap; display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-top: 1px solid var(--border); font-size: 14px; font-variant-numeric: tabular-nums; }
.list li:first-child { border-top: none; padding-top: 0; }
.pill { font-size: 11px; font-weight: 700; border-radius: 999px; padding: 1px 10px; white-space: nowrap; align-self: center; }
.pill.ok { background: var(--green-bg); color: var(--green); }
.pill.wait { background: var(--accent-light); color: var(--accent); }
.plus { color: var(--green); font-weight: 700; }
.minus { color: var(--fg); font-weight: 700; }

.stage { font-size: 18px; font-weight: 700; margin: 0; }
.pace { display: inline-block; font-size: 12px; font-weight: 700; color: var(--accent); background: var(--accent-light); border-radius: 999px; padding: 1px 10px; }
.next { display: flex; gap: 10px; background: var(--green-bg); border-radius: var(--radius-sm); padding: 10px 12px; font-size: 14px; }
.next b { color: var(--green); }

.dots { display: flex; flex-wrap: wrap; gap: 6px; }
.dots span { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--border); }
.dots span.on { background: var(--accent-strong); border-color: var(--accent-strong); }
.dots span.carry { border-style: dashed; }

.grid2 { display: grid; grid-template-columns: 1fr; gap: 14px; }
.visits { display: flex; flex-wrap: wrap; gap: 6px; }
.visits span { font-size: 13px; background: var(--surface2); border-radius: 6px; padding: 2px 8px; font-variant-numeric: tabular-nums; }

.btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.btn { display: block; text-align: center; text-decoration: none; font-weight: 700; font-size: 15px; border-radius: var(--radius-sm); padding: 13px 10px; background: var(--accent-strong); color: #ffffff; border: none; font-family: inherit; cursor: pointer; width: 100%; }
.btn.sub { background: var(--surface); color: var(--fg); border: 1.5px solid var(--border); }
.btn:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
.btn[disabled] { opacity: .6; cursor: default; }

form.login { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 16px; display: flex; flex-direction: column; gap: 14px; }
form.login h1 { font-size: 20px; margin: 0; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-size: 14px; font-weight: 700; }
.field input { font: inherit; font-size: 20px; letter-spacing: .1em; color: var(--fg); background: var(--surface2); border: 1.5px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; width: 100%; font-variant-numeric: tabular-nums; }
.field input:focus-visible { outline: none; border-color: var(--accent); }
.err { color: var(--red); background: var(--red-bg); border-radius: var(--radius-sm); padding: 8px 12px; font-size: 13px; font-weight: 700; margin: 0; }
.hint { font-size: 12px; color: var(--fg3); margin: 0; }
.foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 12px; color: var(--fg3); }
.linkbtn { font: inherit; font-size: 12px; color: var(--fg3); background: none; border: none; text-decoration: underline; cursor: pointer; padding: 4px; }
.banner { background: var(--green-bg); color: var(--green); border-radius: var(--radius); padding: 14px 16px; font-weight: 700; font-size: 16px; text-align: center; margin: 0; }
.banner small { display: block; font-weight: 500; font-size: 13px; color: var(--fg2); margin-top: 2px; }
.choices { display: flex; flex-direction: column; gap: 8px; }
.choices .btn { display: flex; justify-content: space-between; text-align: left; }
.loading { text-align: center; color: var(--fg3); padding: 40px 0; margin: 0; }
</style>
</head>
<body>

<div class="wrap" id="app"><p class="loading">読み込んでいます…</p></div>

<script>
(function () {
  // ===== 設定（ここを書き換えると反映されます）=====
  const CONF = {
    gasUrl: 'https://script.google.com/macros/s/AKfycbxzSuZtADnU2dx7UCerXzRdf3JAaXN06e51kO7iij-Ovj-8BKG8KPdpGnC5CqepxBTo/exec',          // 予約台帳のウェブアプリのURL（予約ページと同じ）。空のときは見本を表示
    liffId: '',          // LIFF ID（LINE Developers で作る）。LINEのログインで本人を確かめるので、入力はいらない
    booking: 'https://junyoulihua5-cmyk.github.io/yoyaku/',
    navi: 'https://junyoulihua5-cmyk.github.io/yoyaku/navi.html',
    tel: '092-672-6640'
  };
  // =====================================================
  const $app = document.getElementById('app');
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const yen = (n) => Number(n || 0).toLocaleString('ja-JP') + '円';
  let idToken = '';
  const MODE = new URLSearchParams(location.search).get('mode') || '';

  const SAMPLE = {
    ok: true, demo: true, no: '1001', name: '千早 太郎', linked: true,
    plan: 'シンプルプラン（施術＋楽トレ）', limit: 4, carry: 1, used: 2,
    stage: '動きを取り戻す時期', pace: '週1〜2回', next: '痛みがほぼなくなったら、再発を防ぐ時期へ進みます',
    balance: 8500, prepaid: [{ date: '2026/11/05', kind: '利用', delta: -1500 }, { date: '2026/10/20', kind: 'チャージ 10,000円', delta: 10500 }, { date: '2026/10/20', kind: '利用', delta: -500 }],
    visits: ['2026-11-05', '2026-10-29', '2026-10-22', '2026-10-15', '2026-10-08'], visitCount: 5,
    upcoming: [{ when: '11月12日(木) 18:30', status: '確定' }, { when: '11月19日(木) 18:30', status: '確認中' }],
    updated: '11/7 09:00'
  };

  // GAS へ JSONP で問い合わせる（予約ページと同じしくみ）
  function ask(params) {
    return new Promise((resolve, reject) => {
      const cb = 'kaiin_cb_' + Date.now();
      const q = new URLSearchParams(Object.assign({ action: 'card', callback: cb }, params));
      const s = document.createElement('script');
      const t = setTimeout(() => { cleanup(); reject(new Error('timeout')); }, 15000);
      function cleanup() { clearTimeout(t); delete window[cb]; s.remove(); }
      window[cb] = (d) => { cleanup(); resolve(d); };
      s.onerror = () => { cleanup(); reject(new Error('network')); };
      s.src = CONF.gasUrl + '?' + q.toString();
      document.body.appendChild(s);
    });
  }

  function msgView(title, text, retry) {
    $app.innerHTML = `<section class="card"><p class="stage">${esc(title)}</p><p class="sub">${text}</p>${retry ? '<button class="btn sub" type="button" id="retry">もう一度読み込む</button>' : ''}</section>
      <div class="btns"><a class="btn" href="${CONF.booking}">予約する</a><a class="btn sub" href="${CONF.navi}">通い方ナビ</a></div>`;
    if (retry) document.getElementById('retry').addEventListener('click', () => { $app.innerHTML = '<p class="loading">読み込んでいます…</p>'; load(); });
  }

  async function load(pick) {
    try {
      const q = { idt: idToken };
      if (MODE === 'checkin') q.mode = 'checkin';
      if (pick) q.pick = pick;
      const d = await ask(q);
      if (d && d.ok) { render(d); return; }
      const r = d && d.reason;
      if (r === 'first') {
        msgView('はじめての方へ', 'ご来院のときに、受付にある<b>QRコード</b>をLINEで読み取ってください。その日から、ここに会員証が表示されます。', false);
        return;
      }
      if (r === 'choose') {
        $app.innerHTML = `<section class="card"><p class="stage">受付：お名前を選んでください</p><p class="sub">ご予約の時間と、お名前の最初の1文字を表示しています。</p>
          <div class="choices">${d.choices.map((c) => `<button class="btn sub" type="button" data-id="${esc(c.id)}"><span>${esc(c.label)}</span><span>${esc(c.when)}〜</span></button>`).join('')}</div>
          <button class="linkbtn" type="button" id="none" style="align-self:center">この中にいない</button></section>`;
        $app.querySelectorAll('[data-id]').forEach((b) => b.addEventListener('click', () => { $app.innerHTML = '<p class="loading">受付しています…</p>'; load(b.getAttribute('data-id')); }));
        document.getElementById('none').addEventListener('click', () => msgView('受付にお声がけください', '本日のご予約が見つかりませんでした。お手数ですが、受付にお声がけください。', false));
        return;
      }
      if (r === 'no_booking') {
        msgView('受付にお声がけください', `${d.name ? esc(d.name) + ' 様、' : ''}本日のこの時間のご予約が見つかりませんでした。お手数ですが、受付にお声がけください。`, false);
        return;
      }
      if (r === 'auth') {
        // ログインの期限が切れていたら、1回だけログインし直す
        let tried = false;
        try { tried = sessionStorage.getItem('kaiin_relogin') === '1'; sessionStorage.setItem('kaiin_relogin', '1'); } catch (e) { tried = true; }
        if (!tried && window.liff) { try { window.liff.logout(); } catch (e) { /* なにもしない */ } window.liff.login({ redirectUri: location.href }); return; }
        msgView('会員証を開けませんでした', 'LINEアプリのリッチメニュー「会員証」から開き直してください。', true);
        return;
      }
      if (r === 'not_ready') { msgView('会員証は準備中です', 'もうしばらくお待ちください。', false); return; }
      msgView('会員証を開けませんでした', 'しばらくしてから、もう一度お試しください。', true);
    } catch (err) {
      msgView('通信がうまくいきませんでした', '電波のよいところで、もう一度開いてください。', true);
    }
  }

  function render(d) {
    const total = (d.limit || 0) + (d.carry || 0);
    const dots = [];
    for (let i = 0; i < total; i++) dots.push(`<span class="${i < d.used ? 'on' : ''}${i >= d.limit ? ' carry' : ''}"></span>`);
    const md = (k) => { const p = String(k).split('-'); return p.length === 3 ? `${Number(p[1])}/${Number(p[2])}` : k; };
    $app.innerHTML = `
      ${d.demo ? '<p class="demo">見本（架空のデータ）</p>' : ''}
      ${d.checkedIn ? `<p class="banner">受付しました${d.when ? `（${esc(d.when)}〜のご予約）` : ''}<small>${d.first ? 'これで会員証が使えるようになりました。次からはリッチメニューの「会員証」から開けます。' : 'おかけになってお待ちください。'}</small></p>` : ''}
      <div class="mcard">
        <p class="clinic">千早駅整骨院</p>
        <p class="label">MEMBERS CARD 会員証</p>
        <p class="nm">${esc(d.name)} 様</p>
        <div class="row"><p class="no">会員番号 <b>${esc(d.no)}</b></p><p class="linked">${d.linked ? 'LINE連携済み' : ''}</p></div>
      </div>

      <section class="card">
        <p class="h">次のご予約</p>
        ${d.upcoming && d.upcoming.length
          ? `<ul class="list">${d.upcoming.map((u) => `<li><span>${esc(u.when)}〜</span><span class="pill ${u.status === '確定' ? 'ok' : 'wait'}">${u.status === '確定' ? '確定' : '院で確認中'}</span></li>`).join('')}</ul>`
          : '<p class="sub">いまはご予約がありません。</p>'}
      </section>

      ${d.stage ? `<section class="card">
        <p class="h">今のあなたの段階</p>
        <p class="stage">${esc(d.stage)}</p>
        ${d.pace ? `<span class="pace" style="align-self:flex-start">通う目安：${esc(d.pace)}</span>` : ''}
        ${d.next ? `<div class="next"><b>→</b><span>${esc(d.next)}</span></div>` : ''}
      </section>` : ''}

      <div class="grid2">
        ${d.plan ? `<section class="card">
          <p class="h">今月の利用（月額プラン）</p>
          <p class="big">${d.used}<small>／${total}回</small></p>
          <p class="sub">${esc(d.plan)}${d.carry ? `（先月からの繰り越し ${d.carry}回をふくむ）` : ''}</p>
          ${total ? `<div class="dots" aria-hidden="true">${dots.join('')}</div>` : ''}
        </section>` : ''}
        <section class="card">
          <p class="h">プリペイド残高</p>
          <p class="big">${yen(d.balance)}</p>
          ${d.prepaid && d.prepaid.length
            ? `<ul class="list">${d.prepaid.map((p) => `<li><span>${esc(String(p.date).replace(/^\d{4}\//, ''))}　${esc(p.kind)}</span><span class="${p.delta > 0 ? 'plus' : 'minus'}">${p.delta > 0 ? '+' : '−'}${yen(Math.abs(p.delta))}</span></li>`).join('')}</ul>`
            : '<p class="sub">ご利用の記録はまだありません。</p>'}
        </section>
      </div>

      <section class="card">
        <p class="h">来院の記録</p>
        <p class="sub">これまでのご来院：<b>${d.visitCount || 0}回</b></p>
        ${d.visits && d.visits.length ? `<div class="visits">${d.visits.map((v) => `<span>${md(v)}</span>`).join('')}</div>` : ''}
      </section>

      <div class="btns">
        <a class="btn" href="${CONF.booking}">予約する</a>
        <a class="btn sub" href="${CONF.navi}">通い方ナビ</a>
      </div>

      <div class="foot"><span>${esc(d.updated || '')} 時点</span></div>`;
  }

  async function start() {
    if (!CONF.gasUrl) { render(SAMPLE); return; }
    if (!CONF.liffId) { msgView('会員証は準備中です', 'もうしばらくお待ちください。', false); return; }
    // LINEのログインで本人を確かめる（患者さんの入力はいらない）
    try {
      await new Promise((ok, ng) => { const s = document.createElement('script'); s.src = 'https://static.line-scdn.net/liff/edge/2/sdk.js'; s.onload = ok; s.onerror = ng; document.head.appendChild(s); });
      await window.liff.init({ liffId: CONF.liffId });
      if (!window.liff.isLoggedIn()) { window.liff.login({ redirectUri: location.href }); return; }
      idToken = window.liff.getIDToken() || '';
    } catch (e) {
      msgView('会員証を開けませんでした', 'LINEアプリのリッチメニュー「会員証」から開いてください。', true);
      return;
    }
    load();
  }
  start();
})();
</script>
</body>
</html>
