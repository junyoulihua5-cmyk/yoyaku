<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>部位別 評価ナビ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 上部に6段階のタブ、本文は1カラム。広い画面では右に「現在の判定」サマリーを固定 */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --surface-2:#e9eeec; --line:#d3dbd8;
  --fg:#1d2624; --muted:#5d6b67;
  --accent:#1f6f63; --accent-soft:#d6ebe6; --on-accent:#ffffff;
  --pos:#b8462e; --pos-soft:#f6e1da; --neg:#2d6a9f; --neg-soft:#dce8f3;
  --warn:#a86a07; --warn-soft:#f7ead0; --crit:#b3261e; --crit-soft:#f8dcd9;
  --f-display:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
  --f-body:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121816; --surface:#1a2220; --surface-2:#232d2a; --line:#33403c;
  --fg:#e4ebe8; --muted:#9aa9a4;
  --accent:#5cbfad; --accent-soft:#1f3a35; --on-accent:#0d1a17;
  --pos:#ee8a72; --pos-soft:#3d2620; --neg:#7fb3e2; --neg-soft:#1e2e3d;
  --warn:#e3a94a; --warn-soft:#3a2e17; --crit:#f08479; --crit-soft:#41201d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121816; --surface:#1a2220; --surface-2:#232d2a; --line:#33403c;
  --fg:#e4ebe8; --muted:#9aa9a4;
  --accent:#5cbfad; --accent-soft:#1f3a35; --on-accent:#0d1a17;
  --pos:#ee8a72; --pos-soft:#3d2620; --neg:#7fb3e2; --neg-soft:#1e2e3d;
  --warn:#e3a94a; --warn-soft:#3a2e17; --crit:#f08479; --crit-soft:#41201d; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top .wrap{padding-block:10px 0;display:flex;flex-direction:column;gap:8px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font-family:var(--f-display);font-size:1.25rem;margin:0;letter-spacing:.02em}
.brand .cur{font-size:.85rem;color:var(--muted)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;border:0;background:none;font:inherit;color:var(--muted);padding:10px 14px 12px;border-bottom:3px solid transparent;cursor:pointer;display:flex;gap:8px;align-items:center;white-space:nowrap}
.tab .n{font-family:var(--f-num);font-size:.8rem;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2)}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent);font-weight:700}
.tab[aria-selected="true"] .n{background:var(--accent);color:var(--on-accent)}
.tab.done .n{background:var(--accent-soft);color:var(--accent)}
.tab .dot{width:8px;height:8px;border-radius:50%;background:var(--crit)}
.tab:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

main.wrap{padding-block:20px 120px;display:grid;grid-template-columns:minmax(0,1fr);gap:24px}
@media (min-width:960px){main.wrap{grid-template-columns:minmax(0,1fr) 320px}}
.step h2{font-family:var(--f-display);font-size:1.4rem;margin:0 0 4px;text-wrap:balance}
.lead{color:var(--muted);margin:0 0 18px;max-width:62ch}
.section-label{font-size:.78rem;letter-spacing:.08em;color:var(--muted);font-weight:700;margin:22px 0 8px}

.regions{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.region{font:inherit;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:96px}
.region b{font-family:var(--f-display);font-size:1.15rem}
.region span{font-size:.82rem;color:var(--muted)}
.region[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent);background:var(--accent-soft)}

.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.row{display:flex;gap:14px;align-items:center;justify-content:space-between;padding:12px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .txt{min-width:0;flex:1}
.row .name{font-weight:700}
.row .how{font-size:.85rem;color:var(--muted)}
.row .meta{font-family:var(--f-num);font-size:.75rem;color:var(--muted)}
.row.flagged{background:var(--crit-soft)}
.row.ispos{background:var(--pos-soft)}
.row.isneg{background:var(--neg-soft)}
@media (max-width:560px){.row{flex-direction:column;align-items:stretch}}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:0 0 auto}
.seg button{font:inherit;font-size:.9rem;border:0;border-left:1px solid var(--line);background:var(--surface);color:var(--fg);padding:10px 14px;min-width:72px;cursor:pointer}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"].p{background:var(--pos);color:#fff;font-weight:700}
.seg button[aria-pressed="true"].n{background:var(--neg);color:#fff;font-weight:700}
.seg button[aria-pressed="true"].u{background:var(--surface-2);color:var(--fg);font-weight:700}
.seg button[aria-pressed="true"].y{background:var(--crit);color:#fff;font-weight:700}
.seg button[aria-pressed="true"].ok{background:var(--accent);color:var(--on-accent);font-weight:700}

.banner{border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;border:1px solid}
.banner b{font-family:var(--f-display);font-size:1.05rem}
.banner.crit{background:var(--crit-soft);border-color:var(--crit);color:var(--fg)}
.banner.warn{background:var(--warn-soft);border-color:var(--warn)}
.banner.good{background:var(--accent-soft);border-color:var(--accent)}
.banner.info{background:var(--surface-2);border-color:var(--line)}
.stack{display:flex;flex-direction:column;gap:12px}

.cond{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.cond h3{margin:0;font-family:var(--f-display);font-size:1.1rem}
.cond .src{font-size:.75rem;color:var(--muted)}
.ctag{font-size:.72rem;letter-spacing:.06em;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:99px;align-self:flex-start}

.res{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:16px;display:flex;flex-direction:column;gap:12px}
.res-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.res-head h3{margin:0;font-family:var(--f-display);font-size:1.2rem}
.pill{font-size:.78rem;font-weight:700;padding:3px 10px;border-radius:99px;white-space:nowrap}
.pill.hi{background:var(--pos-soft);color:var(--pos)}
.pill.mid{background:var(--warn-soft);color:var(--warn)}
.pill.lo{background:var(--neg-soft);color:var(--neg)}
.pill.na{background:var(--surface-2);color:var(--muted)}
.prob{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.prob .big{font-family:var(--f-num);font-size:2rem;font-variant-numeric:tabular-nums;line-height:1}
.prob .rng{font-family:var(--f-num);color:var(--muted);font-size:.9rem}
.bar{position:relative;height:10px;border-radius:99px;background:var(--surface-2)}
.bar .span{position:absolute;top:0;bottom:0;border-radius:99px;background:var(--accent-soft);border:1px solid var(--accent)}
.bar .pre{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--muted)}
.bar .pt{position:absolute;top:-3px;width:16px;height:16px;border-radius:50%;background:var(--accent);transform:translateX(-50%);border:2px solid var(--surface)}
.scale{display:flex;justify-content:space-between;font-family:var(--f-num);font-size:.7rem;color:var(--muted)}
.pre-ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.pre-ctl button{font:inherit;width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.pre-ctl .v{font-family:var(--f-num);color:var(--fg);min-width:3.5ch;text-align:center}
.evid{font-size:.85rem;display:flex;flex-direction:column;gap:2px}
.evid div{display:flex;justify-content:space-between;gap:12px;border-top:1px dashed var(--line);padding-top:4px}
.evid span:last-child{font-family:var(--f-num);color:var(--muted);white-space:nowrap}
details.tx{border-top:1px solid var(--line);padding-top:10px}
details.tx summary{cursor:pointer;font-weight:700;color:var(--accent);list-style:none;display:flex;justify-content:space-between}
details.tx summary::-webkit-details-marker{display:none}
details.tx summary::after{content:"＋";font-weight:400}
details.tx[open] summary::after{content:"－"}
.txlist{margin:10px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.txlist li{display:flex;gap:10px;align-items:flex-start}
.g{font-family:var(--f-num);font-size:.72rem;font-weight:500;padding:1px 7px;border-radius:5px;border:1px solid var(--line);color:var(--muted);flex:0 0 auto;margin-top:3px}
.g.A{border-color:var(--accent);color:var(--accent)}
.g.no{border-color:var(--crit);color:var(--crit)}
.small{font-size:.8rem;color:var(--muted)}

aside .card{position:sticky;top:calc(env(safe-area-inset-top,0px) + 120px);border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:14px;display:flex;flex-direction:column;gap:10px}
aside h4{margin:0;font-size:.78rem;letter-spacing:.08em;color:var(--muted)}
.mini{display:flex;flex-direction:column;gap:8px}
.mini .it{display:flex;flex-direction:column;gap:4px}
.mini .it .l{display:flex;justify-content:space-between;font-size:.88rem}
.mini .it .l span:last-child{font-family:var(--f-num)}
.mini .mb{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.mini .mb i{display:block;height:100%;background:var(--accent)}
@media (max-width:959px){aside{display:none}}

.foot{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.foot .wrap{padding-block:10px;display:flex;gap:10px;justify-content:space-between;align-items:center}
.btn{font:inherit;font-weight:700;border-radius:10px;padding:12px 22px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--fg);min-height:48px}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{border-color:transparent;color:var(--muted);font-weight:500}
.foot .spacer{flex:1}
@media (prefers-reduced-motion:no-preference){.pt,.mini .mb i{transition:left .25s, width .25s}}
.procs{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.proc{border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.proc-head{display:flex;gap:10px;align-items:center;padding:10px 12px;flex-wrap:wrap}
.proc-head .pn{flex:1;min-width:0;font-weight:700}
.proc-head .pn small{display:block;font-weight:400;color:var(--muted);font-size:.8rem}
.mini-btn{font:inherit;font-size:.85rem;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:8px 12px;cursor:pointer;min-height:40px}
.mini-btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.mini-btn.open[aria-expanded="true"]{border-color:var(--accent);color:var(--accent);font-weight:700}
.howto{border-top:1px solid var(--line);padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px}
.howto h5{margin:0;font-size:.75rem;letter-spacing:.08em;color:var(--muted)}
.howto ol{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:6px;max-width:68ch}
.howto p{margin:0;max-width:68ch}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:.92rem}
.kv dt{color:var(--muted);font-weight:700;white-space:nowrap}
.kv dd{margin:0}
.stopbox{background:var(--crit-soft);border-radius:8px;padding:8px 12px;font-size:.9rem}
.notebox{background:var(--warn-soft);border-radius:8px;padding:8px 12px;font-size:.9rem}
.irr{width:100%;border-collapse:collapse;font-size:.85rem;min-width:520px}
.irr th,.irr td{border-top:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.irr th{color:var(--muted);font-weight:700}
.scroll{overflow-x:auto}
.plan-card{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.plan-card .proc{border:0;border-radius:0;background:transparent}
.plan-tools{display:flex;gap:10px;flex-wrap:wrap}
textarea.copy{width:100%;min-height:220px;font:inherit;font-size:.85rem;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);padding:12px}
.toast{font-size:.85rem;color:var(--accent);font-weight:700}
@media (max-width:560px){.kv{grid-template-columns:minmax(0,1fr)}.kv dt{margin-top:4px}}
.pttag{display:inline-block;margin-left:8px;font-size:.7rem;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:1px 8px;border-radius:99px;vertical-align:middle}
body.pt .top, body.pt aside, body.pt .foot{display:none}
body.pt main.wrap{grid-template-columns:minmax(0,1fr);padding-block:28px 48px}
.pt-wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:18px;font-size:1.15rem}
.pt-wrap h2{font-family:var(--f-display);font-size:1.7rem;margin:0;text-wrap:balance}
.plead{margin:0;color:var(--muted);max-width:40em}
.pprog{display:flex;align-items:center;gap:12px;font-family:var(--f-num);font-size:.9rem;color:var(--muted)}
.pbar{flex:1;height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent)}
.pq{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:16px;display:flex;flex-direction:column;gap:12px}
.pq p{margin:0;font-weight:500}
.pchoice{display:grid;gap:10px}
.pchoice.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.pchoice.grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.pbtn{font:inherit;font-size:1.05rem;min-height:60px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:12px 14px;cursor:pointer;text-align:center}
.pbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.pbtn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.pbtn:disabled{opacity:.4;cursor:default}
.pbtn.big{min-height:64px;min-width:140px}
.pnav{display:flex;gap:12px;justify-content:space-between}
.pnav .pbtn{flex:1}
.nrs{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:6px}
.nrs .pbtn{padding:12px 0;font-family:var(--f-num)}
.nrs-l{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted)}
@media (max-width:560px){.nrs{grid-template-columns:repeat(6,minmax(0,1fr))}.pchoice.three{grid-template-columns:minmax(0,1fr)}}
.staff-skip{text-align:center;margin:8px 0 0}
.linkbtn{font:inherit;font-size:.9rem;background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:8px}
.hint{margin:0;font-size:.85rem;color:var(--accent);font-weight:700}
.clinic{margin:0;font-size:.8rem;letter-spacing:.15em;color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.row2{grid-template-columns:minmax(0,1fr)}}
.pin{font:inherit;font-size:1.05rem;color:var(--fg);background:var(--surface-2);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;width:100%;min-height:52px}
.pin:focus-visible{outline:none;border-color:var(--accent)}
.req{color:var(--crit);font-size:.72rem;font-weight:700;margin-left:8px;letter-spacing:.05em}
.pq.invalid{border-color:var(--crit);box-shadow:0 0 0 2px var(--crit-soft)}
.perr{margin:0;color:var(--crit);font-weight:700;text-align:center}
.pchoice.wrap{display:flex;flex-wrap:wrap;gap:8px}
.pchoice.stack{display:flex;flex-direction:column;gap:8px}
.pchoice.stack .pbtn{text-align:left}
.pbtn.chip{min-height:52px;flex:0 0 auto;padding:10px 16px}
.bodymap{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bodyview{text-align:center}
.bodyview p{margin:0;font-size:.85rem;font-weight:700;color:var(--muted)}
.bodyview svg{width:100%;max-width:220px;height:auto}
.part{fill:var(--surface-2);stroke:var(--line);stroke-width:1;cursor:pointer}
.part.sel{fill:var(--accent);stroke:var(--accent)}
.part:focus-visible{outline:none;stroke:var(--fg);stroke-width:2}
.bodyview text,.hand text{fill:var(--muted);font-size:10px;font-family:var(--f-body)}
.picked{display:flex;flex-wrap:wrap;gap:6px;min-height:32px}
.tagp{font:inherit;font-size:.9rem;background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent);border-radius:99px;padding:4px 12px;cursor:pointer}
.picked .none{font-size:.9rem;color:var(--muted)}
.handrow{display:flex;flex-direction:column;align-items:center}
.hand{width:100%;max-width:240px;height:auto}
.consent-text{background:var(--surface-2);border-radius:10px;padding:12px 14px;font-size:.95rem;line-height:1.8}
.consent-text ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
.agree{font:inherit;font-weight:700;display:flex;gap:12px;align-items:center;text-align:left;background:none;border:0;color:var(--fg);padding:8px 0;cursor:pointer;min-height:48px}
.agree .box{width:28px;height:28px;border:2px solid var(--line);border-radius:6px;display:grid;place-items:center;flex:0 0 auto;color:var(--on-accent);font-size:1rem}
.agree[aria-pressed="true"] .box{background:var(--accent);border-color:var(--accent)}
.sigpad{position:relative;border:1.5px dashed var(--line);border-radius:10px;background:#fff}
.sigpad canvas{display:block;width:100%;height:150px;touch-action:none;cursor:crosshair}
.sigpad .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#888;font-size:.9rem;pointer-events:none}
.sigpad .clear{position:absolute;right:8px;top:8px;font:inherit;font-size:.8rem;padding:4px 12px;border-radius:99px;border:1px solid #ccc;background:#fff;color:#333;cursor:pointer}
.whatis{font-size:.95rem;color:var(--muted)}
.whatis summary{cursor:pointer;color:var(--accent);font-weight:700}
.whatis p{margin:6px 0 0;background:var(--surface-2);border-radius:10px;padding:10px 12px;line-height:1.8}
.subtle-btn{font:inherit;font-size:.8rem;color:var(--muted);background:none;border:0;padding:6px 0;text-align:left;cursor:pointer;text-decoration:underline}
.judge{border:1.5px solid var(--accent);border-radius:12px;background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.judge h3{margin:0;font-family:var(--f-display);font-size:1.15rem}
.judge .menu{margin:0;font-size:1.1rem;font-weight:700}
.judge .price{color:var(--accent);font-family:var(--f-num);font-size:.9rem}
.judge ul{margin:0;padding-left:1.2em;font-size:.9rem;color:var(--muted)}

/* ===== 患者管理（予約台帳）とつなぐ：今日の患者さんを選ぶだけで問診が入る／カルテ記載用を送る ===== */
const GASC={url:"https://script.google.com/macros/s/AKfycbxzSuZtADnU2dx7UCerXzRdf3JAaXN06e51kO7iij-Ovj-8BKG8KPdpGnC5CqepxBTo/exec"};
let TODAY={state:"idle",list:[],msg:""};
function gasKey(){ try{ return localStorage.getItem("hyoka_key")||""; }catch(e){ return ""; } }
function gasSetKey(k){ try{ if(k) localStorage.setItem("hyoka_key",k); else localStorage.removeItem("hyoka_key"); }catch(e){} }
function gasAsk(params){ return new Promise((ok,ng)=>{ const cb="hy_cb_"+Date.now()+Math.floor(Math.random()*1000), q=new URLSearchParams(Object.assign({callback:cb,key:gasKey()},params)), sc=document.createElement("script");
  const t=setTimeout(()=>{done();ng(new Error("timeout"));},15000); function done(){clearTimeout(t);delete window[cb];sc.remove();}
  window[cb]=d=>{done();ok(d);}; sc.onerror=()=>{done();ng(new Error("network"));}; sc.src=GASC.url+"?"+q.toString(); document.body.appendChild(sc); }); }
async function loadToday(){ TODAY={state:"loading",list:[],msg:""};
  try{ const d=await gasAsk({action:"staffToday"});
    if(d&&d.ok){ TODAY={state:"ready",list:d.list||[],msg:""}; }
    else if(d&&d.reason==="key"){ gasSetKey(""); TODAY={state:"idle",list:[],msg:"合言葉がちがいます。もう一度入れてください。"}; }
    else TODAY={state:"error",list:[],msg:"一覧を読み込めませんでした。"};
  }catch(e){ TODAY={state:"error",list:[],msg:"通信がうまくいきませんでした。"}; }
  render(); }
function todayBox(){
  if(!GASC.url) return "";
  if(!gasKey()) return `<div class="res imp"><b>スタッフ用の合言葉</b><p class="small" style="margin:0">予約台帳の「準備」で表示された8けたの数字です。この端末に保存され、次からは入れなくてよくなります。</p>${TODAY.msg?`<p class="small" style="margin:0;color:#c0392b"><b>${esc(TODAY.msg)}</b></p>`:""}
    <div class="plan-tools"><input id="gasKeyIn" inputmode="numeric" autocomplete="off" style="font:inherit;font-size:16px;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;max-width:180px" placeholder="12345678"><button type="button" class="btn primary" data-gaskey="1">保存</button></div></div>`;
  if(TODAY.state==="idle"){ setTimeout(loadToday,0); TODAY.state="loading"; }
  const head=`<div class="res imp"><div class="plan-tools" style="justify-content:space-between"><b>今日の患者さんから選ぶ（貼り付け不要）</b><button type="button" class="linkbtn" data-gasreload="1">更新</button></div>`;
  if(TODAY.state==="loading") return head+`<p class="small" style="margin:0">読み込んでいます…</p></div>`;
  if(TODAY.state==="error") return head+`<p class="small" style="margin:0">${esc(TODAY.msg)} 下に貼り付けても取り込めます。</p></div>`;
  if(!TODAY.list.length) return head+`<p class="small" style="margin:0">今日の予約はまだありません。予約台帳に入れると、ここに出ます。</p></div>`;
  return head+`<p class="small" style="margin:0">「問診あり」の方は、押すだけで問診の内容が入ります。${TODAY.msg?`<br><b>${esc(TODAY.msg)}</b>`:""}</p><div class="stack" style="gap:6px">${TODAY.list.map(x=>`<button type="button" class="pbtn" data-gaspick="${esc(String(x.row))}" style="display:flex;justify-content:space-between;gap:10px;text-align:left"><span><b>${esc(x.name)}</b>${x.first?"（初）":""}</span><span class="small">${esc(x.day)} ${esc(x.time)}　${x.mq?"問診あり":"問診なし"}</span></button>`).join("")}</div></div>`;
}
async function gasPick(row){
  TODAY.msg="読み込んでいます…"; render();
  try{ const d=await gasAsk({action:"staffMq",row});
    if(!d||!d.ok){ TODAY.msg=d&&d.reason==="key"?"合言葉を入れ直してください。":"読み込めませんでした。"; if(d&&d.reason==="key") gasSetKey(""); render(); return; }
    if(!d.text){ TODAY.msg=d.name+" 様の問診の内容がまだ届いていません。紙の問診票の方は、入口に戻って「紙の問診票」を選んでください。"; render(); return; }
    TODAY.msg=""; importText(d.text,null,d.pid);
  }catch(e){ TODAY.msg="通信がうまくいきませんでした。"; render(); }
}
async function gasSendChart(){
  const toast=document.getElementById("toast_chartTxt"); if(!GASC.url||!gasKey()){ if(toast) toast.textContent="先に評価ナビの最初で合言葉を入れてください"; return; }
  if(toast) toast.textContent="送っています…";
  try{ const res=await fetch(GASC.url,{method:"POST",body:JSON.stringify({kind:"chart",key:gasKey(),text:chartText(),pid:S.gasPid||""})});
    let d=null; try{ d=await res.json(); }catch(e){}
    if(toast) toast.textContent=d?(d.ok?"患者管理に入れました："+d.msg:"入れられませんでした："+d.msg):"送りました（患者カードで確認してください）";
  }catch(e){ if(toast) toast.textContent="送れませんでした。電波を確認してもう一度押してください"; }
}

function figSVG(pose,at,arrow){
  const P=POSE[pose]; if(!P) return "";
  const [x,y]=P.L[at]||[100,60];
  let ar="";
  const A={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]}[arrow];
  if(A){ const sx=x+A[0]*10, sy=y+A[1]*10, ex=x+A[0]*28, ey=y+A[1]*28;
    ar=`<line class="fg-arrow" x1="${sx}" y1="${sy}" x2="${ex}" y2="${ey}" marker-end="url(#ah)"/>`; }
  else if(arrow==="rot"){ ar=`<path class="fg-arrow" d="M ${x-14} ${y-6} A 15 15 0 1 1 ${x+12} ${y-10}" marker-end="url(#ah)"/>`; }
  return `<svg class="fig" viewBox="0 0 200 120" role="img" aria-label="${P.label}の模式図"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="fg-ahead"/></marker></defs>
    ${P.draw}<circle class="fg-hi" cx="${x}" cy="${y}" r="7"/>${ar}<text class="fg-txt" x="8" y="14">${P.label}</text></svg>`;
}
function testHowHTML(id){

    <div><h5>やり方</h5><ol>${h.steps.map(s=>`<li>${s}</li>`).join("")}</ol></div>
    ${(typeof TIPS!=="undefined"&&TIPS[id])?`<div><h5>手の置き方</h5><p>${TIPS[id].hand}</p></div>`:""}
    <div class="posbox"><b>陽性：</b>${h.pos}</div>
    ${(typeof TIPS!=="undefined"&&TIPS[id])?`<div class="tipbox"><b>コツ・注意：</b>${TIPS[id].tip}</div>`:""}</div>`;

function palpHTML(rid){
  const P=PALP[rid]; if(!P) return "";
  return `<details class="res palp"><summary><b>触診ガイド：どこを触って、何を見るか</b><span class="small">（${P.length}か所）</span></summary>
  <p class="small" style="margin:0">必ず健側から触って、左右を比べてください。強い圧痛・変形・腫れがあるときは、無理に動かす検査の前に骨折などの除外を優先します。</p>
  <div class="list">${P.map(p=>`<div class="row"><div class="txt"><div class="name">${p.n}</div><div class="how"><b>見つけ方：</b>${p.f}</div><div class="meta"><b>見ること：</b>${p.l}</div></div></div>`).join("")}</div></details>`;
}

function ageOf(b){ if(!b) return null; const d=new Date(b),n=new Date(); if(isNaN(d)) return null; let a=n.getFullYear()-d.getFullYear(); if(n.getMonth()<d.getMonth()||(n.getMonth()===d.getMonth()&&n.getDate()<d.getDate())) a--; return a>=0&&a<120?a:null; }
const isMinor = pa=>{ if(pa.adult==="y") return false; if(pa.adult==="n") return true; const a=ageOf(pa.birth); return a!==null&&a<18; };   /* 成年年齢は18歳（民法） */

function mqRequired(page){
  const P=MQ.pa, m=[], need=k=>{ if(P[k]===undefined||P[k]===null||P[k]==="") m.push(k); };
  if(page==="about"){ ["name","kana","birth","sex","tel","postal","address"].forEach(need); if(MQ.opts.mode==="remote") need("history"); }
  if(page==="area"){ if(!P.parts.length&&!P.areaOther) m.push("parts"); if(P.parts.length>1) need("main"); }
  if(page==="state"){ need("feel"); need("nprs"); }
  if(page==="kind") need("kind");
  if(page==="onset"){ need("since"); if(P.acc!=="1"){ need("how"); if(TRAUMA_HOW.includes(P.how)) need("where"); } need("otherNow"); }
  if(page==="accident"){ ["accDate","accPos","accPolice","accHosp"].forEach(need); }
  if(page==="safety"){ PT_RF.forEach(f=>need(f.id)); ptMoreShown(PT_MORE.common,P).forEach(x=>need(x.k)); }
  if(page==="care"){ if(!P.safety.length) m.push("safety"); if(!(P.ill||[]).length) m.push("ill"); }
  if(page==="region"){ const r=ptRegionOf(P); if(r==="lumbar") SSHQ.forEach((_,i)=>need("q"+(i+1))); (PT_EXTRA[r]||[]).forEach(x=>need(x.k)); ptMoreShown(PT_MORE[r],P).forEach(x=>need(x.k)); }
  if(page==="hope"){ if(!P.expect.length) m.push("expect"); need("goal"); }
  if(page==="consent"){ need("adult"); need("agreeIns"); need("agreeTx");
    if(P.adult==="n"){ need("guardian"); if(MQ.opts.mode!=="remote") need("sigG"); } }
  return m;
}

function mqInitSigs(root){
  (root||document).querySelectorAll(".sigpad").forEach(pad=>{
    const key=pad.dataset.sig, cv=pad.querySelector("canvas"), ph=pad.querySelector(".ph");
    const r=cv.getBoundingClientRect(); cv.width=Math.round((r.width||300)*2); cv.height=Math.round((r.height||140)*2);
    const ctx=cv.getContext("2d"); Object.assign(ctx,{lineWidth:5,lineCap:"round",lineJoin:"round",strokeStyle:"#111"});
    if(MQ.pa[key]){ const im=new Image(); im.onload=()=>ctx.drawImage(im,0,0,cv.width,cv.height); im.src=MQ.pa[key]; }
    let drawing=false; const pos=e=>{const b=cv.getBoundingClientRect();return [(e.clientX-b.left)*2,(e.clientY-b.top)*2];};
    cv.addEventListener("pointerdown",e=>{drawing=true;cv.setPointerCapture(e.pointerId);const [x,y]=pos(e);ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+.1,y+.1);ctx.stroke();ph.hidden=true;});
    cv.addEventListener("pointermove",e=>{if(!drawing)return;const [x,y]=pos(e);ctx.lineTo(x,y);ctx.stroke();});
    const end=()=>{ if(!drawing) return; drawing=false; const out=document.createElement("canvas"); out.width=400; out.height=Math.round(400*cv.height/cv.width); const c=out.getContext("2d"); c.fillStyle="#fff"; c.fillRect(0,0,out.width,out.height); c.drawImage(cv,0,0,out.width,out.height); MQ.pa[key]=out.toDataURL("image/jpeg",.7); MQ.perrKeys=MQ.perrKeys.filter(k=>k!==key); };
    cv.addEventListener("pointerup",end); cv.addEventListener("pointercancel",end);
  });
}
/* クリック・入力。処理したら true を返す */
function mqClick(e){
  const keep=fn=>{ const y=window.scrollY; fn(); MQ.opts.rerender(); window.scrollTo({top:y}); };
  const sv=e.target.closest("[data-part]"); if(sv){ const n=sv.dataset.part; keep(()=>{ const P=MQ.pa; P.parts=P.parts.includes(n)?P.parts.filter(x=>x!==n):[...P.parts,n]; if(P.main&&!P.parts.includes(P.main)) P.main=undefined; MQ.perrKeys=MQ.perrKeys.filter(k=>k!=="parts"); }); return true; }
  const fv=e.target.closest("[data-finger]"); if(fv){ const v=fv.dataset.finger; keep(()=>{ const F=MQ.pa.fingers||[]; MQ.pa.fingers=F.includes(v)?F.filter(x=>x!==v):[...F,v]; }); return true; }
  const b=e.target.closest("button"); if(!b) return false;
  if(b.dataset.pa){ const k=b.dataset.pa, v=b.dataset.v, multi=b.dataset.multi==="1", tog=b.dataset.toggle==="1";
    keep(()=>{ const P=MQ.pa;
      if(multi){ let arr=P[k]||[]; arr=arr.includes(v)?arr.filter(x=>x!==v):[...arr,v]; if(k==="safety"||k==="avoid"||k==="diet"||k==="tgoal"||k==="accSym"||k==="ill") arr=v==="特になし"&&arr.includes(v)?["特になし"]:arr.filter(x=>x!=="特になし"||v==="特になし"); P[k]=arr; }
      else if(tog||MQ_LIFE_KEYS.includes(k)) P[k]=P[k]===v?undefined:v;
      else P[k]=v;
      if(k==="how"&&!TRAUMA_HOW.includes(v)) { P.where=undefined; P.causeDetail=undefined; }
      if(k==="kind"){
        if(v==="acc"){ P.acc="1"; P.where="交通事故"; P.how="交通事故"; }
        else { if(P.acc==="1"||P.where==="交通事故"){ P.acc=undefined; P.where=undefined; P.how=undefined; }
          if(v==="chronic"&&TRAUMA_HOW.includes(P.how)){ P.how=undefined; P.where=undefined; P.causeDetail=undefined; }
          if(v==="acute"&&P.how&&!TRAUMA_HOW.includes(P.how)) P.how=undefined; } }
      if(k==="ins"&&["none","seiho"].includes(v)) { P.insRel=undefined; P.insName=undefined; }
      MQ.perrKeys=MQ.perrKeys.filter(x=>x!==k); if(!MQ.perrKeys.length) MQ.perr="";
    }); return true; }
  if(b.dataset.sigclear){ keep(()=>{ MQ.pa[b.dataset.sigclear]=undefined; }); return true; }
  if(b.dataset.pgo){ const d=+b.dataset.pgo, pages=mqPages(), page=pages[MQ.pstep];
    if(d<0&&MQ.pstep===0){ MQ.opts.onBackFirst&&MQ.opts.onBackFirst(); return true; }
    if(d>0&&!["welcome","choice","signwelcome"].includes(page)){ const miss=mqRequired(page); if(miss.length){ MQ.perrKeys=miss; MQ.perr="赤枠の項目にお答えください。"; MQ.opts.rerender(); const el=document.querySelector(".pq.invalid"); if(el) el.scrollIntoView({behavior:"smooth",block:"center"}); return true; } }
    MQ.perr=""; MQ.perrKeys=[];
    if(d>0&&MQ.pstep===pages.length-1){ MQ.opts.onDone&&MQ.opts.onDone(); return true; }
    MQ.pstep=Math.max(0,Math.min(pages.length-1,MQ.pstep+d)); MQ.opts.rerender(); window.scrollTo({top:0}); return true; }
  if(b.dataset.paper){ if(b.dataset.paper==="1"){ MQ.pa.paper="1"; MQ.opts.onDone&&MQ.opts.onDone(); } else { MQ.pa.paper=undefined; MQ.pstep=1; MQ.opts.rerender(); window.scrollTo({top:0}); } return true; }
  return false;
}
function mqInput(e){ const k=e.target.dataset&&e.target.dataset.in; if(!k) return false; MQ.pa[k]=e.target.value; MQ.perrKeys=MQ.perrKeys.filter(x=>x!==k); if(k==="postal") mqZipLookup(e.target.value); if(k==="address") MQ.zipAuto=null; if(k==="name") mqKanaFromInput(e); if(k==="height"||k==="weight"){ const b=mqBmi(MQ.pa), el=document.getElementById("bmiMsg"); if(el) el.textContent=b!==null?"BMI "+b:""; } if(k==="kana") MQ.kana.auto=null; return true; }
/* ---- お名前からふりがな：日本語入力で変換する前の「ひらがな」を拾って入れる（変換後の漢字から読みは推測しない）---- */
MQ.kana={buf:"",cur:"",auto:null};
const MQ_HIRA=/^[ぁ-ゖゝゞー　 ]+$/;
const mqToHira=s=>String(s).replace(/[ァ-ヶ]/g,ch=>String.fromCharCode(ch.charCodeAt(0)-0x60));
function mqKanaApply(){
  const cur=MQ.pa.kana||""; if(cur&&cur!==MQ.kana.auto) return;      /* 手で直したふりがなは上書きしない */
  const v=MQ.kana.buf.replace(/[　 ]+/g," ").trim();
  MQ.pa.kana=v||undefined; MQ.kana.auto=v; const el=document.getElementById("pa_kana"); if(el) el.value=v;
  MQ.perrKeys=MQ.perrKeys.filter(x=>x!=="kana");
}
function mqKanaFromInput(e){
  if(e.isComposing) return;
  const v=e.target.value;
  if(!v.trim()){ MQ.kana.buf=""; mqKanaApply(); return; }
  if(MQ_HIRA.test(mqToHira(v))){ MQ.kana.buf=mqToHira(v); mqKanaApply(); return; }   /* ひらがな・カタカナのまま確定した場合 */
  if(e.inputType==="insertText"&&/^[　 ]$/.test(e.data||"")){ MQ.kana.buf+=" "; mqKanaApply(); }
}
document.addEventListener("compositionstart",e=>{ if(e.target.id==="pa_name") MQ.kana.cur=""; });
document.addEventListener("compositionupdate",e=>{ if(e.target.id!=="pa_name") return; const d=mqToHira((e.data||"").replace(/[a-zａ-ｚ]+$/i,"")); if(d&&MQ_HIRA.test(d)) MQ.kana.cur=d; });

/* ---- 郵便番号から住所（日本郵便の郵便番号データ。ajaxzip3形式をCDNから読み込み）---- */
const PREF = ["","北海道","青森県","岩手県","宮城県","秋田県","山形県","福島県","茨城県","栃木県","群馬県","埼玉県","千葉県","東京都","神奈川県","新潟県","富山県","石川県","福井県","山梨県","長野県","岐阜県","静岡県","愛知県","三重県","滋賀県","京都府","大阪府","兵庫県","奈良県","和歌山県","鳥取県","島根県","岡山県","広島県","山口県","徳島県","香川県","愛媛県","高知県","福岡県","佐賀県","長崎県","熊本県","大分県","宮崎県","鹿児島県","沖縄県"];
const MQ_ZIP_URL = p=>`https://cdn.jsdelivr.net/npm/japan-postal-code@0.3.0/zipdata/zip-${p}.js`;
MQ.zipCache={}; MQ.zipAuto=null;
function mqZipLookup(raw){
  const z=String(raw).replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248)).replace(/\D/g,"");
  const msg=t=>{ const el=document.getElementById("zipMsg"); if(el){ el.textContent=t; el.hidden=!t; } };
  if(z.length!==7){ msg(""); return; }
  const fill=data=>{
    const r=data&&data[z]; if(!r){ msg("この郵便番号の住所が見つかりませんでした。住所をそのまま入力してください。"); return; }
    const head=PREF[r[0]]+r[1]+r[2]+(r[3]||"");
    const el=document.getElementById("pa_address");
    const cur=MQ.pa.address||"";
    if(!cur||cur===MQ.zipAuto){ MQ.pa.address=head; MQ.zipAuto=head; if(el){ el.value=head; MQ.perrKeys=MQ.perrKeys.filter(x=>x!=="address"); } }
    msg("住所を入れました。続けて番地・建物名・部屋番号を入力してください。");
    if(el){ el.focus(); try{ el.setSelectionRange(el.value.length,el.value.length); }catch(err){} }
  };
  const p=z.slice(0,3);
  if(MQ.zipCache[p]){ fill(MQ.zipCache[p]); return; }
  window.zipdata=d=>{ MQ.zipCache[p]=d; if(MQ.zipWant===p) fill(d); };
  MQ.zipWant=p; msg("住所を調べています…");
  const s=document.createElement("script"); s.src=MQ_ZIP_URL(p); s.async=true;
  s.onerror=()=>msg("住所を自動で入れられませんでした。住所をそのまま入力してください。");
  document.head.appendChild(s);
}

/* ---- メニューの提案：完全自費・月額プランを第一提案にし、食事指導につなげる ----

   そのうえで、自費の施術を組み合わせたコース → 痛みが落ち着いたら月額プラン、の順で案内する */
const PRICE = {'保険診療のみ':'窓口負担のみ','スタンダードコース':'初診・2回目 2,300円／3回目以降 1,500円','全身ケアコース':'初診・2回目 4,800円／3回目以降 3,700円','リカバリーコース':'初診・2回目 5,300円／3回目以降 4,500円','全身プレミアムケア':'8,800円（学生 5,000円）','全身トータルケア':'5,500円（学生 3,000円）','ピンポイント痛みケア':'3,500円（学生 1,500円）'};
const MONTHLY = {
  simple:{name:"シンプルプラン（施術＋{dev}）",p:{4:"15,000円",8:"24,000円",12:"33,000円"},s:{4:"10,000円",8:"16,000円",12:"22,000円"}},
  diet:{name:"食事改善プラン（施術＋食事指導）",p:{4:"18,000円",8:"32,000円",12:"44,000円"},s:{4:"12,000円",8:"20,000円",12:"28,000円"}},
  train:{name:"{dev}プラン（施術＋{dev}＋食事指導）",p:{4:"25,000円",8:"44,000円",12:"60,000円"},s:{4:"16,000円",8:"28,000円",12:"38,000円"}},
  full:{name:"プレミアムプラン（施術＋楽トレ＋低酸素＋食事指導）",p:{4:"35,000円",8:"60,000円",12:"85,000円"},s:{4:"22,000円",8:"39,000円",12:"54,000円"}}
};
const SPORT_RE=/部|スポーツ|サッカー|野球|バスケ|バレー|テニス|陸上|ラン|マラソン|ゴルフ|ジム|水泳|ダンス|柔道|剣道|空手|ラグビー|ハンド|卓球|バド/;
/* 楽トレ（EMS）・低酸素トレーニングのどちらが合いそうか。根拠の強さは控えめに扱う：
   ・EMS/NMES：膝OAへの効果は研究間で一致せず不確実（Giggins 2012 Clin Rehabil、Samarkandi 2026 Orthop Rev）。
     高齢者・サルコペニアでは全身EMSで筋量の改善を示したRCTあり（Kemmler 2016/2017 Clin Interv Aging）。運動の代わりではなく、運動が難しい人の補助として。
   ・低酸素トレーニング：反復スプリントの能力に小さな上乗せの可能性（Brocherie 2017 Sports Med）。体重・代謝への上乗せは研究が少なく不確実（Hobbins 2017）。 */
function mqDevices(pa){
  const P=pa||{}, tg=P.tgoal||[], ex=P.expect||[], dq=P.diet||[], age=ageOf(P.birth), r=ptRegionOf(P), ph=phaseOf(P);
  const sf=P.safety||[], ng=sf.includes("ペースメーカー")||sf.includes("妊娠中");
  let rk=0, hx=0; const why=[];
  if(tg.includes("筋力をつけたい（運動は苦手）")){rk+=2;why.push("運動は苦手だが筋力をつけたい");}
  if(tg.includes("お腹まわり・体を引き締めたい")){rk+=2;why.push("体を引き締めたい");}
  if((P.avoid||[]).includes("運動は自信がない")||P.exer==="ほとんどしない") rk+=1;
  if(P.prot==="あまり食べない"&&age!==null&&age>=65) rk+=1;
  if(age!==null&&age>=60){rk+=1;why.push("60歳以上：筋力の維持");}
  if((r==="knee"||r==="hip"||r==="lumbar")&&ph!=="a") rk+=1;
  if(tg.includes("体力・持久力をつけたい")){hx+=2;why.push("体力・持久力をつけたい");}
  if(tg.includes("スポーツのパフォーマンスを上げたい")||ex.includes("スポーツのパフォーマンスを上げたい")){hx+=2;rk+=1;why.push("スポーツのパフォーマンス");}
  if(tg.includes("短い時間で効率よく運動したい")){hx+=1;rk+=1;why.push("短い時間で効率よく");}
  if(dq.includes("疲れやすい・よく眠れない")||ex.includes("疲れ・睡眠・自律神経")) hx+=1;
  if(dq.includes("体重を減らしたい")) hx+=1;
  const noE=ng||(P.avoid||[]).includes("電気が苦手");
  if(noE) rk=0; if(ng) hx=0;
  const want=Math.max(rk,hx)>=2;
  const main=rk===0&&hx===0?(noE&&ng?null:noE?"低酸素":"楽トレ"):(hx>rk?"低酸素":"楽トレ");
  return {rk,hx,main:ng&&noE?null:main,both:rk>=2&&hx>=2,want,why};
}
/* 保険（健康保険）が使えそうか：原因がはっきりした急なケガ（外傷）で、1か月以内。最終判断は来院時 */
function mqInsLikely(P){ if(isAcc(P)) return false; const d=sinceDaysOf(P); return TRAUMA_HOW.includes(P.how)&&d!==null&&d<=30&&P.otherNow!=="通っている"; }
const MQ_INS_CARD = "保険を使うには、受付で<b>マイナ保険証（マイナンバーカード）または資格確認書</b>の確認が必要です。お持ちでない場合は、いったん全額のお支払いをお願いすることがあります。保険が使えるかどうかは、来院時にケガの状態をうかがって判断します。";
function mqJudge(pa){
  const r=pa||{}, why=[], also=[]; if(!r.how&&!r.goal) return null;
  const ds=sinceDaysOf(r), trauma=TRAUMA_HOW.includes(r.how)&&!!r.where, painful=Number(r.feel)<=5;
  const car=isAcc(r), work=r.where==="仕事・通勤中";
  const nAreas=(r.parts||[]).length+(r.areaOther?1:0), many=nAreas>=3;
  const age=ageOf(r.birth), student=age!==null&&age<=22;
  const sf=r.safety||[], noElec=sf.includes("ペースメーカー")||(r.avoid||[]).includes("電気が苦手"), ex=r.expect||[], goal=r.goal;
  const sporty=r.where==="運動・部活中"||SPORT_RE.test(r.sport||"")||ex.includes("スポーツのパフォーマンスを上げたい");
  const dietQ=(r.diet||[]).filter(v=>v!=="特になし");
  const lf=mqLife(r);
  const wantDiet=goal==="diet"||ex.includes("ダイエット・お腹まわり")||dietQ.length>0||lf.dietScore>=3;
  const tired=ex.includes("疲れ・睡眠・自律神経")||dietQ.includes("疲れやすい・よく眠れない");
  const train=["prevent","return"].includes(goal)||sporty||ex.includes("再発しない体にしたい");
  const cont=r.careAfter==="yes"||r.careAfter==="hear"||["prevent","return","whole","diet"].includes(goal)||ex.includes("再発しない体にしたい");
  const dv=mqDevices(r), dev=dv.main;
  const n=r.pace==="週2以上"?8:r.pace==="週1回くらい"?4:null;
  /* 保険の区分（目安） */
  let track,cls;
  if(car){track="自賠責（交通事故）";cls="acc";why.push("交通事故のケガ"+(r.accDate?`（事故日 ${r.accDate}）`:""));}
  else if(r.otherNow==="通っている"){track="自費（病院に通院中）";cls="self";why.push("同じケガで病院に通院中のため保険は使えない");}
  else if(trauma&&painful&&ds!==null&&ds<=14){track=work?"保険（労災を確認）":"保険の対象";cls=work?"chk":"ins";why.push(`${r.where}で${r.how}（${(SINCE.find(x=>x[0]===r.since)||[,""])[1]}）`);}
  else if(trauma&&painful&&ds===30){track="要確認";cls="chk";why.push("原因は明確だが2週間以上たっている");}
  else{track="自費";cls="self"; if(!TRAUMA_HOW.includes(r.how)) why.push(`きっかけが「${r.how||"—"}」でケガではない`); else if(ds===null||ds>30) why.push("1か月以上前、または時期が不明"); if(!painful) why.push("痛みではなく体のチェックが目的");}
  /* 月額プラン（継続・食事） */
  let mk=null;
  if(wantDiet&&dev&&(train||dv.want)) mk=dv.both?"full":"train"; else if(wantDiet) mk="diet"; else if((cont||dv.want)&&dev) mk="simple";
  let monthly=null;
  if(mk){ const M=MONTHLY[mk], k=n||4; monthly={key:mk,name:M.name.replace(/\{dev\}/g,dev||"楽トレ"),count:k,price:`月${k}回 ${M.p[k]}`+(student?`（学生 ${M.s[k]}）`:""),fixed:!!n}; }
  /* 1回ごとの完全自費メニュー */
  let self;
  if(goal==="quick"||goal==="short") self="ピンポイント痛みケア";
  else if((goal==="return"||(many&&train)||dv.want)&&dev) self="全身プレミアムケア";
  else if(["whole","prevent","diet"].includes(goal)||r.feel==="6"||many) self="全身トータルケア";
  else self="ピンポイント痛みケア";
  /* 第一提案 */
  let menu,note="",price,next=null,flow=[];
  if(cls==="acc"){
    menu="交通事故の施術（自賠責）"; price="窓口0円（相手方の保険会社に確認）";
    next=monthly?`施術が終わったら → 再発予防に ${monthly.name}（${monthly.price}）`:`施術が終わったら → ${self}（プリペイドカードあり）`;
    flow=["相手方の保険会社へ連絡（当院での施術を伝えてもらう）","整形外科の受診・診断書を確認（併院も可）","自賠責で施術（窓口0円）・経過を記録","症状が落ち着いたら：再発予防の月額プラン・完全自費へ"];
    const sy=r.accSym||[], neuro=sy.includes("手や腕のしびれ")||sy.includes("手や腕に力が入りにくい");
    const neck=sy.includes("首の痛み")||ptRegionOf(r)==="neck";
    if(neck) also.push(`むち打ち損傷の目安：${neuro?"WAD III（神経症状あり）→ 神経学的検査を必ず":"WAD I〜II（検査で判断）"}（Quebec Task Force）`);
    if(neuro) also.push("しびれ・筋力低下：神経学的検査、悪化していれば医療機関へ");
    if(sy.includes("めまい")||sy.includes("吐き気")) also.push("めまい・吐き気：頭部外傷の確認（悪化・意識障害があれば救急へ）");
    if(r.accHosp!=="y") also.push("まだ病院に行っていない：整形外科の受診・診断書をすすめる（骨折の除外・保険の手続き）");
    if(r.accPolice&&r.accPolice!=="届けた（人身事故）") also.push("警察：人身事故の届けがまだ。人身事故証明書が取れない場合は「人身事故証明書入手不能理由書」が必要");
    if(r.accWork==="仕事を休んでいる") also.push("休業損害の対象になりうる：保険会社に確認するよう伝える");
  } else if(cls!=="self"){
    if(r.insOnly==="1"){ menu="保険診療のみ"; why.push("保険の範囲の処置のみ希望（自費の内容を説明してから確定）"); }
    else if(dev&&(train||cont||dv.want)){ menu="リカバリーコース"; note=dev; why.push("保険の対象のケガ＋早い回復・再発予防のための自費（矯正・"+dev+"）"); }
    else { menu="全身ケアコース"; why.push("保険の対象のケガ＋全身の施術（自費）"); }
    price=PRICE[menu]||"";
    next=monthly?`痛みが落ち着いたら → ${monthly.name}（${monthly.price}）`:`痛みが落ち着いたら → ${self}（プリペイドカードあり）`;
    flow=["保険の対象のケガは保険も使える（必ず説明）","急性期：自費の施術を組み合わせたコースで回復を早める","痛みが落ち着いた時点で、保険は区切り（毎月見直し）","継続：月額プランまたは完全自費へ"];
    also.push("保険を使う場合：マイナ保険証または資格確認書でオンライン資格確認（受領委任）");
    if(student) also.push("学生・医療助成の月初料金を確認");
  } else if(monthly&&(n||cont)){
    menu=monthly.name; price=monthly.price; why.push(wantDiet?"食事・体重の希望あり → 食事指導つきの月額":"継続ケアの希望あり → 月額");
    next=`初回は ${self}（${PRICE[self]}）で体の状態を確認してから月額へ`;
    flow=["初回：完全自費の施術と検査・説明","2回目以降：月額プランで定期的に","食事指導は月額プランにふくめて継続"];
  } else {
    menu=self; price=PRICE[self]; why.push(goal==="short"?"短い時間を希望":goal==="quick"?"今の痛みを早く楽にしたい":many?`痛む場所が${nAreas}か所`:"完全自費の施術");
    if(monthly) next=`通院が続くなら → ${monthly.name}（${monthly.price}）`; else next="通院が続くなら → プリペイドカード（10,000円で10,500円分など）";
    flow=["初回：完全自費の施術と検査・説明","通院が続く場合はプリペイドカード・月額プランを案内"];
  }
  if(wantDiet&&!/食事/.test(menu+(monthly?monthly.name:""))) also.push("食事指導を案内（食事改善プラン）");
  if(wantDiet&&dietQ.length) also.push("食事・体の気がかり："+dietQ.join("、"));
  const r2=ptRegionOf(r);
  if(wantDiet&&(r2==="knee"||r2==="hip")) also.push("体重の減量はひざ・股関節の痛みの改善に有効（OARSI 2019）");

  if(lf.flags.length) also.push("体と食事の気になる点："+lf.flags.join("／"));

  if(lf.shortSleep) also.push("睡眠5時間未満：成人は6時間以上が目安（睡眠ガイド2023）");
  if(r.careAfter==="no") also.push("継続ケアは「今回の痛みだけ」の希望：無理にすすめない");

}

/* 術者がタブレットで聞き取りながら入力する画面（紙の問診票の方・追加の聞き取り）。住所・保険・同意は紙の問診票で確認 */
function mqInterviewHTML(){
  const P=MQ.pa, pages=["kind","area","state","onset"]; if(isAcc(P)) pages.push("accident"); pages.push("safety","care"); if(ptRegionOf(P)) pages.push("region"); pages.push("life","hope");
  return `<div class="pt-wrap iv">${mqField("お名前（カルテ用・任意）",mqInp("name","千早 太郎"),null,true)}${mqField("生年月日（年齢の判定に使います・任意）",mqInp("birth","","date"),null,true)}${pages.map(p=>`<section class="ivsec">${mqRender(p)}</section>`).join("")}</div>`;
}
/* ---- 回答からの「施術の進め方（目安）」：料金・コースではなく、何をするかの方向性。最終決定は検査のあと ----
   根拠：急性の軟部組織損傷 PEACE & LOVE（Dubois & Esculier 2020 BJSM）、足関節捻挫（Vuurberg 2018 BJSM）、
   腰痛（腰痛診療ガイドライン2019）、頸部痛（Blanpied 2017 JOSPT）、膝OA（OARSI 2019）、肩関節周囲炎（Kelley 2013 JOSPT）、
   肩の腱障害（Diercks 2014 Acta Orthop）、外側上顆痛（Coombes 2015 JOSPT）、手根管症候群（Erickson 2019 JOSPT）、足底腱膜症（Koc 2023 JOSPT） */
function mqDirection(pa){
  const P=pa||{}, out=[], r=ptRegionOf(P), ph=phaseOf(P), trauma=TRAUMA_HOW.includes(P.how), av=P.avoid||[], ex=P.expect||[];
  if(PT_RF.some(f=>P[f.id]==="y")) out.push("先に詳しくお話をうかがい、必要なときは病院での検査をおすすめします");
  if(isAcc(P)){ out.push("交通事故のケガ：骨折や神経の症状がないかを確かめ、必要なときは病院での検査をおすすめします");
    out.push("むち打ちなどの痛みは、安静にしすぎず、できる範囲で動かしていくことが回復につながります");
    out.push("保険会社への連絡や書類の準備もご案内します（自賠責保険で窓口0円）"); }
  if(P.otherNow==="通っている") out.push("通院中の病院の治療内容をうかがってから、施術を合わせます");
  const acuteTrauma=trauma&&(ph==="a"||(P.since==="d1"||P.since==="d7"||P.since==="d14"));
  if(acuteTrauma&&(r==="lumbar"||r==="neck")){
    out.push(r==="lumbar"?"急な腰の痛み：安静にしすぎず、できる範囲で動いてもらうための説明と、痛みを和らげる手技・処置":"急な首の痛み：痛みを和らげる手技・処置と、痛みの出ない範囲で首を動かす運動");
    out.push("痛みが落ち着くのに合わせて、運動を少しずつ増やします");
  } else if(acuteTrauma){

/* 判定フローの分岐のうち、問診の答えで決まるもの（2026-11-09：患者が答える形に） */
const PFv = v=>v==="y"||v==="n"?v:null;
const PFany = (...v)=>v.includes("y")?"y":v.length&&v.every(x=>x==="n")?"n":null;
const PF = k=>P=>PFv(P[k]);
const FLOW_PF = {
 f1:{q1:P=>P.l_leg==="n"?"n":PFv(P.l_both), a2:PF("l_saddle"), a3:PF("g_rest"), b1:PF("l_line"), p1:PF("l_posture"), c1:PF("q2")},
 f2:{r1:PF("l_sudden"), r3:PF("l_night"), r4:PF("l_move"), r2:P=>ptFever(P), r7:PF("g_rest"), r8:PF("l_abd"), r6:P=>ptBpHigh(P),
     r10:P=>P.how||isAcc(P)?(ptTr(P)?"y":"n"):null, r12:P=>P.sex==="男性"?"n":PFv(P.l_cycle)},
 nk:{v6:PF("n_arm"), v8:PF("n_head")},
 sh:{h4:PF("s_neck"), h5:PF("s_visc"), h8:P=>PFany(P.s_disl,P.s_fear)},
 el:{e4:PF("e_neck"),
     e5:P=>{const F=P.fingers||[]; if(["f1","f2","f3"].some(x=>F.includes(x))) return "y"; if(F.length) return "n"; return P.e_night==="n"&&P.e_shake==="n"?"n":null;},
     e7:P=>{const F=P.fingers||[]; if(["f4","f5"].some(x=>F.includes(x))) return "y"; return F.length?"n":null;},
     e9:PF("e_thumb"), e11:PF("e_lat")},
 hp:{p3:P=>P.h_nwb==="y"?"y":null, p5:PF("h_back"), p6:PF("h_lat"), p8:PF("h_groin")},
 kn:{k5:P=>PFany(P.k_give,P.k_swell,P.k_pop), k7:PF("k_med"), k9:PF("k_lock"), k11:PF("k_stairs")},
 an:{a4:PF("f_snap"), a6:PF("f_twist"), a8:PF("f_heel"), a9:PF("a_ach")}
};
function flowsFor(rid){ return Object.entries(FLOWS).filter(([,F])=>F.region===rid); }
/* 分岐の答え：検査・外傷ルール・危険サイン・クラスターから分かるものは自動、ほかは手入力 */
function flowAuto(N,id){
  if(N.t&&S.t[N.t]) return S.t[N.t]==="p"?"y":"n";
  if(N.cl&&N.cl.every(id=>S.t[id])) return N.cl.filter(id=>S.t[id]==="p").length>=N.k?"y":"n";
  if(N.rule){ const rr=ruleResult(); if(S.trauma==="n") return "n"; if(rr&&(rr.positive||rr.complete)) return rr.positive?"y":"n"; }
  if(N.rf&&S.rf[N.rf]) return S.rf[N.rf];
  if(N.trauma&&S.trauma) return S.trauma;
  const pf=S.flow.f&&FLOW_PF[S.flow.f]&&FLOW_PF[S.flow.f][id]; if(pf){ const v=pf(S.pa); if(v) return v; }
  return null;
}
function flowAns(n){ const N=FLOWS[S.flow.f].nodes[n]; return S.flow.a[n]||flowAuto(N,n)||undefined; }
/* 答えに沿って進む。戻ってきた分岐はループとして止める */
function flowWalk(){
  if(!S.flow.f) return null;
  const F=FLOWS[S.flow.f], path=[], seen=new Set(); let cur=F.start;
  while(cur){
    if(cur.startsWith("E_")) return {path,end:cur};
    if(seen.has(cur)) return {path,loop:cur};
    seen.add(cur); const a=flowAns(cur); path.push({id:cur,a});
    if(!a) return {path,next:cur};
    cur=F.nodes[cur][a==="y"?"y":"n"];
  }
  return {path};
}
function flowEnd(){ if(!S.flow.f||FLOWS[S.flow.f].region!==S.region) return null; const w=flowWalk(); return w&&w.end?FLOW_END[w.end]:null; }
function flowBanner(E){
  const cls={crit:"crit",warn:"warn",good:"good",info:"info"}[E.lv];
  return `<div class="banner ${cls}"><b>フローの結論：${E.name}</b><span>${E.act}</span><span class="small">確認すること：${E.chk}</span></div>`;
}
function flowHTML(){
  const list=flowsFor(S.region); if(!list.length) return "";
  if(list.length===1&&S.flow.f!==list[0][0]) S.flow={f:list[0][0],a:{}};

  const f=S.flow.f&&FLOWS[S.flow.f].region===S.region?S.flow.f:null;
  const basis=list[0][1].basis, sem=basis==="セミナー";
  let h=`<div class="flow"><span class="ctag">判定フロー（${esc(basis)}）</span><h3>${REGION_JP[S.region]||""}の判定フロー</h3>
   <p class="small" style="margin:0">はい／いいえで進めます。問診の答え・検査・外傷ルール・危険サインで分かる分岐は自動で入ります（押して変えることもできます）。${sem?"「流れのみ」の印は、精度の研究がまだ確認できていない分岐です。":"各分岐の根拠は、分岐の下に書いています。"}</p>`;
  if(!f){
    const leg=S.pa.q1==="y"||(S.pa.motion||[]).includes("しびれがある");
    h+=`<div class="flow-pick">${list.map(([k,F])=>`<button type="button" class="region" data-flow="${k}" aria-pressed="false"><b>${F.name.split(" ")[0]}</b><span>${F.name.split(" ").slice(1).join(" ")}${(k==="f1"&&leg)?"（問診で脚の症状あり）":""}</span></button>`).join("")}</div>`;
    return h+`</div>`;
  }
  const F=FLOWS[f], w=flowWalk();
  h+=`<p class="small" style="margin:0"><b>${F.name}</b>　${list.length>1?`<button type="button" class="linkbtn" data-flow="">フローを選び直す</button>　`:""}<button type="button" class="linkbtn" data-flreset="1">答えを消す</button></p><div class="flow-path">`;
  w.path.forEach((p,i)=>{
    const N=F.nodes[p.id], cur=!p.a, auto=!S.flow.a[p.id]&&flowAuto(N,p.id);
    const pv=N.pa&&(S.pa[N.pa]==="y"||S.pa[N.pa]==="n")?`<div class="h">問診：${S.pa[N.pa]==="y"?"はい":"いいえ"}</div>`:"";
    h+=`<div class="flow-step ${cur?"cur":""}"><div class="txt"><div class="q"><span class="no">${i+1}</span>${N.q}${N.ev==="sem"?' <span class="pill na">流れのみ</span>':""}${auto?' <span class="pttag">問診・検査から自動</span>':""}</div>${N.hint?`<div class="h">${N.hint}</div>`:""}${pv}</div>
      ${seg("fl:"+p.id,p.a||"",[["y","はい","p"],["n","いいえ","n"]])}</div>`;
  });
  h+=`</div>`;
  if(w.end) h+=flowBanner(FLOW_END[w.end]);
  else if(w.loop) h+=`<div class="banner info"><b>同じ分岐に戻りました</b><span>フローがここで一周します（${F.nodes[w.loop].q}）。下の検査の結果で判断してください。</span></div>`;
  return h+`</div>`;
}

/* ===== 状態 ===== */
const STEPS = ["聞き取り・部位","危険サイン","外傷ルール","検査","結果と施術","施術プラン"];
const LAST = STEPS.length-1;
function fresh(){ return {mode:"start", src:null, imported:false, pstep:0, pa:mqFreshPA(), fromPt:{}, step:0, region:null, rf:{}, trauma:null, rule:{}, t:{}, pre:{}, plan:[], planAuto:false, open:{}, topen:{}, nprs:"", showAll:false, ps:{}, flow:{f:null,a:{}}, at:{}}; }
let S = fresh();

const $ = s=>document.querySelector(s);
const esc = s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const region = ()=>REGIONS.find(r=>r.id===S.region);
const sinceDays = ()=>{ const s=SINCE.find(x=>x[0]===S.pa.since); return s?s[2]:null; };
function phase(){ const d=sinceDays(); if(d==null) return null; return d<=30?"a":d<=90?"s":"c"; }
const PHASE_LABEL={a:"急性期（1か月以内）",s:"亜急性期（1〜3か月）",c:"慢性期（3か月以上）"};
const mainPart = ()=> S.pa.main || (S.pa.parts.length===1?S.pa.parts[0]:null);

/* ===== 計算 ===== */
function lrOf(t,res){ if(t.sens==null||t.spec==null) return null; if(res==="p") return Math.min(25,t.spec>=1?25:t.sens/(1-t.spec)); if(res==="n") return (1-t.sens)/t.spec; return null; }
const post=(pre,lr)=>{const o=pre/(1-pre)*lr;return o/(1+o);};
function evaluate(c){
  const pre=(S.pre[c.id]??c.pre)/100; const ev=[]; const used=new Set();
  if(c.cluster && c.cluster.ids.every(id=>S.t[id])){ const cnt=c.cluster.ids.filter(id=>S.t[id]==="p").length; const r=c.cluster.f(cnt); if(r){ ev.push({label:c.cluster.name+"："+r.l,lr:r.lr}); c.cluster.ids.forEach(id=>used.add(id)); } }
  c.items.forEach(id=>{ if(used.has(id)) return; const t=T[id],r=S.t[id]; if(!r) return; const lr=lrOf(t,r); if(lr==null) return; ev.push({label:t.name+(r==="p"?" 陽性":" 陰性"),lr}); });
  if(!ev.length) return {pre,p:null,ev};
  const all=ev.reduce((a,e)=>a*e.lr,1); const strong=ev.reduce((a,e)=>Math.abs(Math.log(e.lr))>Math.abs(Math.log(a))?e.lr:a,1);
  const p1=post(pre,all),p2=post(pre,strong); return {pre,p:p1,lo:Math.min(p1,p2),hi:Math.max(p1,p2),ev};
}
function ruleResult(){
  const r=region(); if(!r||!r.rule||S.trauma!=="y") return null;
  const R=RULES[r.rule]; let positive=false,complete=true;
  for(const g of R.groups){ const vals=g.items.map(i=>S.rule[i.id]); if(vals.some(v=>!v)) complete=false;
    if(g.type==="any_yes_positive"&&vals.includes("y")) positive=true;
    if(g.type==="none_yes_positive"&&vals.every(v=>v==="n")) positive=true;
    if(g.type==="no_positive"&&vals[0]==="n") positive=true; if(positive) break; }
  return {positive,complete};
}
const rfShown=()=>RED_FLAGS.filter(f=>!f.only||f.only.includes(S.region));
const anyRF=()=>rfShown().some(f=>S.rf[f.id]==="y");
function pct(x){return x==null?"—":(x*100<1?"1%未満":x*100>99?"99%超":Math.round(x*100)+"%");}
function level(p){return p==null?["na","未判定"]:p>=.6?["hi","疑いが強い"]:p>=.25?["mid","可能性あり"]:["lo","可能性は低い"];}

/* 問診の回答から、疾患ごとの「優先度」（どの検査から始めるか）を決める */
function priority(c){
  const P=S.pa, y=k=>P[k]==="y"; let s=0, why=[];
  const add=(n,w)=>{s+=n; why.push(w);};
  switch(c.id){
    case "csm": if(y("n_clumsy")) add(3,"手先が使いにくい"); if(y("n_gait")) add(3,"歩行でふらつく"); break;
    case "cr": if(y("n_arm")) add(3,"腕・手の痛みやしびれ"); break;
    case "np": add(1,"首の痛み"); break;
    case "cgh": if(y("n_head")) add(3,"頭痛を伴う"); break;
    case "wad": if(isAcc(P)||P.kind==="acc") add(3,"交通事故のあと"); break;
    case "sis": if(y("s_lift")) add(3,"挙上の途中で痛む"); if(y("s_night")) add(1,"夜間痛"); break;
    case "rct": if(TRAUMA_HOW.includes(P.how)) add(2,"けがのきっかけあり"); if((ageOf(P.birth)??0)>=60) add(1,"60歳以上"); break;
    case "inst": if(y("s_disl")) add(4,"脱臼の既往"); break;
    case "acj": break;
    case "fs": if(y("s_dm")) add(2,"糖尿病・甲状腺"); if(y("s_other")) add(2,"反対側の既往"); if(y("s_night")) add(1,"夜間痛"); break;
    case "let": if(y("e_lat")) add(4,"ひじの外側の痛み"); break;
    case "cts": if(y("e_shake")) add(2,"手を振ると楽"); if(y("e_night")) add(2,"夜間のしびれ"); if((P.fingers||[]).some(f=>["f1","f2","f3"].includes(f))) add(2,"親指〜中指の症状"); break;
    case "dq": if(y("e_thumb")) add(4,"手首の親指側の痛み"); break;
    case "cub": if((P.fingers||[]).some(f=>["f4","f5"].includes(f))) add(3,"薬指・小指の症状"); break;
    case "ldh": if((P.motion||[]).includes("しびれがある")) add(2,"しびれがある"); if(["y"].includes(P.q1)) add(2,"脚の症状"); if((ageOf(P.birth)??99)<50) add(1,"50歳未満"); break;
    case "lss": { const s2=sshqScoreOf(S.pa); if(s2&&s2.pos) add(4,"狭窄症の問診票が陽性"); if(y("q2")) add(1,"歩くと悪化・休むと楽"); break; }
    case "nslbp": add(1,"腰の痛み"); break;
    case "hoa": if(y("h_groin")) add(3,"脚のつけ根の痛み"); if(y("h_sock")) add(1,"靴下がはきにくい"); break;
    case "acl": if(y("k_give")) add(3,"膝くずれ"); if(y("k_swell")) add(2,"受傷直後の腫れ"); break;
    case "men": if(y("k_lock")) add(3,"引っかかり・伸びない"); break;
    case "pfp": if(y("k_stairs")) add(3,"しゃがみ・階段でお皿のまわりが痛い"); break;
    case "koa": if((ageOf(P.birth)??0)>=50) add(2,"50歳以上"); if(!TRAUMA_HOW.includes(P.how)) add(1,"けがのきっかけなし"); break;
    case "atr": if(y("f_snap")) add(5,"けられた感じ・断裂音"); break;
    case "las": if(y("f_twist")) add(4,"足首を内側にひねった"); break;
    case "pf": if(y("f_heel")) add(4,"起床時の一歩目の痛み"); break;
  }
  const fe=flowEnd(); if(fe&&fe.cond===c.id){ s+=6; why.unshift("判定フローの結論"); }
  return {s,why};
}
function ranked(){
  const r=region(); if(!r) return [];
  return r.conds.map(c=>({c,e:c.qual?null:evaluate(c),pr:priority(c)})).sort((a,b)=>{
    const pa=a.e?.p, pb=b.e?.p;
    if(pa!=null||pb!=null){ const d=(pb??0)-(pa??0); if(Math.abs(d)>.05) return d; }
    return b.pr.s-a.pr.s;
  });
}
/* 自動で決める主な疾患：確率が40%以上ならそれ、なければ問診の優先度が最も高いもの */
function primaryCond(){
  const rk=ranked(); if(!rk.length) return null;
  const withP=rk.filter(x=>x.e&&x.e.p!=null&&x.e.p>=.4).sort((a,b)=>b.e.p-a.e.p);
  if(withP.length) return withP[0].c;
  const byPr=[...rk].sort((a,b)=>b.pr.s-a.pr.s);

function groupFits(label){
  const ph=phase(), n=+S.nprs;
  if(/補助|頭痛/.test(label)) return label.includes("頭痛")&&S.pa.n_head==="y";
  if(/過敏/.test(label)) return n>=7;
  if(label.includes("亜急性期")) return ph==="s";
  if(label.includes("急性期")) return ph==="a"||ph===null||(ph==="s"&&false);
  if(label.includes("慢性期")) return ph==="c"||ph==="s";
  if(label.includes("回復期")) return ph!=="a";
  return true;
}

  const ids=[]; c.tx.groups.forEach(([lab,g])=>{ if(groupFits(lab)) g.forEach(id=>{ if(!ids.includes(id)) ids.push(id); }); });

async function photoRead(){

  if(!lim||!lim.images){ PHOTO.msg=PHOTO_ERR.images_unavailable; render(); return; }
  const files=PHOTO.files.slice(0,lim.images.maxCount||4);
  PHOTO.busy=true; PHOTO.msg=""; PHOTO.ctl=new AbortController(); render();

  PHOTO.busy=false; render(); window.scrollTo({top:0});
}

  if(r){ const rk=ranked().filter(x=>x.e&&x.e.p!=null); if(rk.length) L.push(`疑い：${rk.map(x=>`${x.c.name} ${pct(x.e.p)}（${pct(x.e.lo)}〜${pct(x.e.hi)}）`).join("／")}`); const pc=primaryCond(); if(pc) L.push(`主な見立て：${pc.name}${phase()?"（"+PHASE_LABEL[phase()]+"）":""}`); }

  if(S.plan.length){ L.push("施術プラン："); S.plan.forEach((id,i)=>{const p=PROC[id]; L.push(`  ${i+1}. ${p.name}［${p.g}］ 量：${p.dose}`);}); }

  L.push("再評価：同じ検査とNRSで比較（2点または30%以上の変化が目安）");

function homeText(){

function atVal(it){ return S.at[it.id]!==undefined?S.at[it.id]:!!(it.auto&&it.auto(S.pa)); }
function atCalc(k){

  const status=stop.length?"不可":hold?"保留":care.length?"注意して可":"可";
  const score=stop.length?0:raw;
  return {D,stop,care,hit,zero,score,status,lv:AT_LV(score)};
}

function psAvg(){ const v=["as","bs","cs"].map(k=>S.ps[k]).filter(x=>x!==""&&x!=null).map(Number); return v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length*10)/10:""; }
function psCircle(opts,i){ return opts.map((o,k)=>k===i?`<b class="ps-on">${esc(o)}</b>`:esc(o)).join(" ・ "); }
function psToday(){ const d=new Date(); return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`; }

function psRows(n,numbered,first){

  ${row("初回からの変化",i=>init(i)?"—":"　点（　％）")}

  ${row("全体の変化（7段階）",i=>init(i)?"—":"")}
  ${row("判定 A・B・C・D",i=>init(i)?"—":"A・B・C・D")}
